import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = mod_version
group = mod_group_id
base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
}

// Libraries that get shaded (bundled) into the final jar.
//  - jlayer  : pure-Java MP3 decoder (same library Fantastic Pass uses)
//  - jcodec  : pure-Java MP4 / H.264 decoder used by the video player
configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    shade "javazoom:jlayer:1.0.1"
    shade "org.jcodec:jcodec:0.2.5"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

// El jar "slim" lleva solo el mod (clases + recursos + refmap de Mixin).
// Las librerias se anaden despues, ya reubicadas, en la tarea 'shadedJar'.
tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

// La tarea shadowJar que crea el plugin arrastraria TODO el classpath (Minecraft
// incluido). No la usamos: montamos la nuestra a mano.
tasks.named('shadowJar').configure {
    enabled = false
}

/*
 * Empaquetado final.
 *
 * jlayer y jcodec se reubican a com.fscrates.libs.* a proposito. Forge mete cada
 * mod en su propio modulo de Java (JPMS) y dos modulos NO pueden exportar el
 * mismo paquete: si otro mod trae las mismas librerias en la raiz del jar (por
 * ejemplo Fantastic Pass, que tambien empaqueta jlayer, o mods de audio como
 * etched o gamediscs) el juego ni arranca:
 *
 *   ResolutionException: Modules fantasticpass and fscrates export package
 *                        javazoom.jl.player to module ...
 *
 * Al reubicarlas, nuestras copias viven en un paquete que solo es nuestro y
 * dejan de chocar con nadie.
 *
 * Se parte del jar ya reobfuscado y se le anaden las librerias, asi que no hace
 * falta volver a reobfuscar (la reubicacion no toca referencias a Minecraft).
 */
tasks.register('shadedJar', ShadowJar) {
    dependsOn tasks.named('reobfJar')

    archiveClassifier = ''
    destinationDirectory = layout.buildDirectory.dir('libs')

    from({ zipTree(tasks.named('jar', Jar).get().archiveFile.get().asFile) })
    configurations = [project.configurations.shade]

    relocate 'javazoom', "${mod_group_id}.libs.javazoom"
    relocate 'org.jcodec', "${mod_group_id}.libs.org.jcodec"
    relocate 'net.sourceforge.jaad', "${mod_group_id}.libs.net.sourceforge.jaad"

    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/maven/**'
    exclude 'module-info.class'
    exclude 'LICENSE*'
    exclude 'NOTICE*'
    exclude 'git.properties'
    exclude 'org/jcodec/testing/**'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
}

tasks.named('assemble').configure {
    dependsOn 'shadedJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:none'
    options.compilerArgs << '-nowarn'
}
